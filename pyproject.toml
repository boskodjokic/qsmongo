[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qsmongo"
version = "0.3.0"
description = "Turn an HTTP query string into a safe, typed MongoDB filter."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Bosko Djokic" }]
keywords = ["mongodb", "query string", "filtering", "pagination", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/boskodjokic/qsmongo"
Issues = "https://github.com/boskodjokic/qsmongo/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/qsmongo"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
